<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern Tech Gradient -->
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" /> <!-- Cyan -->
      <stop offset="50%" stop-color="#818CF8" /> <!-- Indigo -->
      <stop offset="100%" stop-color="#C084FC" /> <!-- Purple -->
    </linearGradient>
  </defs>

  <!-- Smooth Dark Background (Slate 900) -->
  <rect width="512" height="512" rx="112" fill="#0F172A" />

  <!-- The 'N' Network Path -->
  <path d="M144 368 V 144 L 368 368 V 144" stroke="url(#nexusGrad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Connection Nodes -->
  <circle cx="144" cy="368" r="32" fill="#FFFFFF" />
  <circle cx="144" cy="144" r="32" fill="#FFFFFF" />
  <circle cx="256" cy="256" r="32" fill="#FFFFFF" />
  <circle cx="368" cy="368" r="32" fill="#FFFFFF" />
  <circle cx="368" cy="144" r="32" fill="#FFFFFF" />
</svg>
